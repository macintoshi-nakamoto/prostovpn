name: windows-desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows-desktop.yml']

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build installers (MSI + EXE)
        # Номер запуска как номер сборки: checkout в CI неглубокий, поэтому
        # счётчик коммитов там всегда 1 и версия установщика не росла бы
        env:
          PROSTO_BUILD: ${{ github.run_number }}
        run: ./gradlew packageMsi packageExe --no-daemon

      - name: Print jpackage logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build/compose/logs -ErrorAction SilentlyContinue | Where-Object { -not $_.PSIsContainer } | ForEach-Object {
            Write-Host "===== $($_.FullName) ====="
            Get-Content $_.FullName
          }

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: ProstoVPN-windows-msi
          path: windows/build/compose/binaries/main/msi/*.msi

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ProstoVPN-windows-exe
          path: windows/build/compose/binaries/main/exe/*.exe

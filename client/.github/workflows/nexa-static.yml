name: 'Nexa static validation'

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branding-and-metadata:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify product identity, metadata and resources
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-branding.ps1

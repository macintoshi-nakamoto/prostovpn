<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Prosto VPN</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#0b0f14; color:#e7edf5; font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; }
  form { background:#141a22; border:1px solid #26303c; border-radius:14px; padding:26px; width:320px; }
  h1 { font-size:19px; margin:0 0 18px; }
  label { display:block; font-size:13px; color:#8b9bb0; margin:12px 0 5px; }
  input { width:100%; padding:9px 11px; border-radius:8px; border:1px solid #26303c;
          background:#1b232d; color:#e7edf5; font:inherit; }
  button { width:100%; margin-top:18px; padding:10px; border:0; border-radius:8px;
           background:#4da3ff; color:#06121f; font:inherit; font-weight:600; cursor:pointer; }
  .err { margin-top:14px; color:#ff5f56; font-size:13px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Панель Prosto VPN</h1>
  <label>Логин</label>
  <input name="login" autofocus autocomplete="username">
  <label>Пароль</label>
  <input name="password" type="password" autocomplete="current-password">
  <button type="submit">Войти</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
</form>
</body>
</html>

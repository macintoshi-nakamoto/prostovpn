# Версия приложения. Единственное место, где она задана.
#
# Растёт руками при каждой выкладке — как versionName у Android-клиента.
# Считать её числом коммитов в истории нельзя: историю однажды свернули в
# один коммит, и сборка стала называть себя 1.0.1 при том, что у людей уже
# стояла 1.0.16. Панель сравнивает версии честно, поэтому обновление просто
# перестало предлагаться — «установлена последняя версия».
#
# Формат — три числа: major (0..255), minor (0..255), build (0..65535).
# Такие пределы у версии MSI, и выходить за них нельзя: установщик просто
# не соберётся.
prostoVersion=1.0.29

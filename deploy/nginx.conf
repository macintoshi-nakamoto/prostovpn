# nginx для Prosto: сайт, панель и API на одном домене.
#
# ЭТО ОБРАЗЕЦ ДЛЯ РУЧНОЙ УСТАНОВКИ, а не конфиг «на каждый сервер».
# deploy/bootstrap.sh генерирует свой /etc/nginx/sites-available/prosto-panel,
# и слинковать оба сразу нельзя: получатся два server-блока на 443 с одним
# server_name, и nginx -t упадёт на конфликте. Берите либо тот, либо этот.
#
# Отличие от сгенерированного: здесь статику сайта отдаёт сам nginx (см.
# root ниже), поэтому в .env нужно поставить пустой PANEL_SITE_DIR= — иначе
# те же файлы будет параллельно раздавать приложение.
#
# Ставится в /etc/nginx/sites-available/prosto и линкуется в sites-enabled.
# Сертификат выпускается certbot'ом (см. deploy/README.md).
#
# Три вещи, ради которых этот файл существует в репозитории, а не
# «настроится на месте»:
#   1. вебхук должен доходить до приложения без выкрутасов и без кук;
#   2. админка не должна быть открыта всему интернету;
#   3. HSTS и редирект на https ставятся один раз и не забываются.

# Один общий лимит на попытки входа. Основная защита — в самой панели, со
# счётчиком в базе; эта — грубая, чтобы шквал запросов не дошёл до Python.
limit_req_zone $binary_remote_addr zone=prosto_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=prosto_api:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Единственное, что отдаём по http, — подтверждение домена для certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Два года и поддомены. Включать только когда https уже точно работает:
    # браузер запомнит заголовок и обратно на http не пойдёт.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # ── Вебхуки платёжных сервисов ────────────────────────────────────────
    # Отдельным блоком и первым: сюда ходит сервер провайдера, а не браузер.
    # Ни CORS, ни кук, ни ограничения частоты — провайдер имеет право
    # повторять доставку сколько угодно, и отбитый нами повтор означает
    # оплаченный заказ без доступа.
    location /api/v1/billing/webhook/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Панель проверяет адрес отправителя по списку провайдера — сюда
        # должен приходить настоящий адрес, а не адрес nginx.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Вход ──────────────────────────────────────────────────────────────
    location = /api/v1/login {
        limit_req zone=prosto_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Остальное API ─────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=prosto_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Админка ───────────────────────────────────────────────────────────
    # Открытая всему интернету форма входа в админку — приглашение её
    # подбирать. Оставьте один из двух способов, а лучше оба.
    location /admin {
        # Способ первый: пускать только со своих адресов.
        # allow 203.0.113.7;      # офис
        # allow 198.51.100.0/24;  # VPN команды
        # deny all;

        # Способ второй: пароль поверх панели.
        #   apt install apache2-utils
        #   htpasswd -c /etc/nginx/.htpasswd-prosto имя
        # auth_basic "Prosto";
        # auth_basic_user_file /etc/nginx/.htpasswd-prosto;

        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Установщики приложения ────────────────────────────────────────────
    # Каталог лежит вне /opt/prosto-vpn намеренно: домашний каталог панели
    # создаётся с правами 0750, и nginx от www-data через него не пройдёт.
    location /downloads/ {
        alias /var/www/prosto-downloads/;
        autoindex off;
        sendfile on;
        client_max_body_size 0;
        # Именно expires, а не add_header Cache-Control: свой add_header в
        # location отменяет наследование серверных заголовков, и установщики
        # уехали бы клиенту без nosniff и остальных трёх со строк выше.
        expires 1d;
    }

    # ── Сайт ──────────────────────────────────────────────────────────────
    # Статику отдаёт nginx: он делает это быстрее и не тратит воркеры
    # приложения. В .env при этом ставится PANEL_SITE_DIR= (пусто).
    #
    # Каталог — собранный одностраничник из web/ (npm run build), а не
    # прежние статические страницы: их место занял сайт на React.
    root /opt/prosto-vpn/web/dist;
    index index.html;

    # Маршрутизация у одностраничника своя: по прямой ссылке на /account,
    # /faq или /login файла на диске нет, и вернуть надо тот же index.html —
    # иначе перезагрузка страницы даёт 404. Собственную страницу «не
    # найдено» рисует само приложение.
    location / {
        try_files $uri $uri/ /index.html;
        # Страницу не кэшируем никогда: она ссылается на файлы по именам, и
        # закэшированная продолжает тянуть прежние. Однажды сайт так и
        # остался со старым логотипом у всех, кто заходил раньше, — на
        # сервере лежал новый, в браузере жила прежняя страница.
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        # Год и immutable: в именах бандлов хеш, в именах картинок версия,
        # поэтому старый файл никогда не выдаётся за новый. add_header
        # Cache-Control рядом с expires был бы лишним — expires выставляет
        # его сам, а вместе с ним отменялось наследование заголовков
        # безопасности: для js и css важнее всего потерянный nosniff.
        expires 1y;
    }

    # Страница успеха показывает логин и пароль — кэшировать её нельзя ни
    # браузеру, ни промежуточным прокси.
    location = /success.html {
        add_header Cache-Control "no-store" always;
        # Свой add_header отменяет серверные, а на странице с паролем они
        # нужны больше, чем где-либо: повторяем весь набор целиком.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        # X-Frame-Options считается устаревшим, современные браузеры смотрят
        # на frame-ancestors — иначе кнопки копирования пароля можно накрыть
        # чужой страницей.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    error_page 404 /404.html;
}

# Бан на уровне nginx, а не пакетного фильтра: за Cloudflare пакеты приходят
# с адресов Cloudflare, и nftables-бан настоящего адреса никогда не совпадает.
# nginx сравнивает deny с $remote_addr уже после real_ip — то есть с человеком.
# Файл deny включается из http{} (conf.d/*.conf), поэтому действует на все
# сайты сервера. Перед reload — nginx -t: испорченный файл оставит nginx на
# старой конфигурации, а не уронит его.
#
# Здесь echo, а не printf: в ini fail2ban знак % — интерполяция. grep -vxF
# на пустом результате даёт код 1 — потому «;», а не «&&». flock — оба
# jail'а пишут один файл.
[Definition]
actionstart = [ -f <denyfile> ] || install -m 0644 /dev/null <denyfile>
actionstop  = <actionflush>
actionflush = flock <lock> sh -c ': > <denyfile>; /usr/sbin/nginx -t -q && /usr/sbin/nginx -s reload'
actioncheck =
actionban   = flock <lock> sh -c 'grep -qxF "deny <ip>;" <denyfile> || echo "deny <ip>;" >> <denyfile>; /usr/sbin/nginx -t -q && /usr/sbin/nginx -s reload'
actionunban = flock <lock> sh -c 'grep -vxF "deny <ip>;" <denyfile> > <denyfile>.tmp; mv <denyfile>.tmp <denyfile>; /usr/sbin/nginx -t -q && /usr/sbin/nginx -s reload'

[Init]
denyfile = /etc/nginx/conf.d/f2b-deny.conf
lock = /run/lock/f2b-nginx-deny.lock

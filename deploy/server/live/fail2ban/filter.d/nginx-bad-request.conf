# Сканеры чужих движков. Ловим по пути, а НЕ по коду 404: сайт — SPA с
# заглушкой, он отдаёт главную страницу и код 200 на любой неизвестный
# адрес, поэтому 404 в журнале не бывает вовсе.
[Definition]
failregex = ^<HOST> .* "(GET|POST|HEAD) [^"]*(wp-login|wp-admin|xmlrpc\.php|phpmyadmin|/\.env|/\.git|/vendor/|/cgi-bin/|/\.aws|/\.ssh|\.php)[^"]*"
ignoreregex =
datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]

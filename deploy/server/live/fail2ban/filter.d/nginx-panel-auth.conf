# Неудачные входы в панель и кабинет по журналу nginx.
# Панель и сама придерживает перебор, но там счётчик живёт в базе и отвечает
# 429 — то есть запрос всё равно доходит до питона. Здесь адрес отсекается
# на входе.
#
# Форма регулярки намеренно простая (^<HOST> .* "..."): вариант с явным
# разбором полей `- \S+ \[дата\]` в fail2ban не совпадает ни с одной живой
# строкой — проверено fail2ban-regex на боевом журнале.
[Definition]
failregex = ^<HOST> .* "POST /api/(admin|v1)/(login|password/forgot|password/reset)[^"]*" (401|403|429)
ignoreregex =
datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]

# Укрепление nginx. Лимиты частоты живут отдельно, в prosto-limits.conf.

# Версия сервера в заголовке и на страницах ошибок — бесплатная подсказка о
# том, какие уязвимости к нам применимы.
server_tokens off;

# Ограничение одновременных соединений с адреса. Держит slowloris и простой
# флуд: лимит частоты считает запросы, а этот — открытые соединения, которые
# запросов ещё не прислали. 20 с запасом: установщик тянется в несколько
# потоков, а на странице параллельно грузятся ассеты.
limit_conn_zone $binary_remote_addr zone=prosto_conn:10m;

# Таймауты: соединение, которое не присылает заголовки или тело, должно
# отваливаться быстро, а не занимать воркер.
client_header_timeout 15s;
client_body_timeout   15s;
send_timeout          30s;
keepalive_timeout     30s;
reset_timedout_connection on;

# Явный набор шифров вместо умолчаний сборки: без RSA-обмена ключами, только
# AEAD и только с прямой секретностью.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
# Билеты сессий хранят ключ на сервере и при утечке раскрывают прошлый трафик.
ssl_session_tickets off;
limit_req_status 429;
limit_conn_status 429;
# Медленные тела и заголовки — под таймаутами выше; большие тела — только вебхукам.

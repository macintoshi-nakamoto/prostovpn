# Грубая защита, чтобы шквал запросов не доходил до Python. Основная — в
# самой панели, со счётчиком в базе.
#
# Люди из-под VPN выходят в интернет через MASQUERADE узла и приходят на
# панель с его адресом; с того же адреса ходит и сам узел (агент, проверка
# Hysteria2). Один общий ключ $binary_remote_addr значил, что один клиент
# под VPN выедает лимит всему узлу и всем его пользователям. Поэтому ключ
# раздвоен: для узлов — свои зоны и пустой ключ в зонах для людей (пустой
# ключ nginx не считает вовсе), и наоборот. geo смотрит на $remote_addr уже
# после real_ip (CF-Connecting-IP), то есть видит настоящий адрес. Новый узел
# — дописать адрес сюда, иначе он живёт по старым лимитам.
geo $remote_addr $prosto_from_node {
    default 0;
    103.114.43.44 1;
    109.107.168.166 1;
    194.35.226.8 1;
}
map $prosto_from_node $prosto_person_key {
    0 $binary_remote_addr;
    1 "";
}
map $prosto_from_node $prosto_node_key {
    1 $binary_remote_addr;
    0 "";
}

limit_req_zone $prosto_person_key zone=prosto_login:10m rate=10r/m;
limit_req_zone $prosto_person_key zone=prosto_api:10m rate=120r/m;
limit_req_zone $prosto_node_key zone=prosto_node_login:1m rate=60r/m;
limit_req_zone $prosto_node_key zone=prosto_node_api:1m rate=1200r/m;

# Одновременные соединения с адреса (сами limit_conn — в vhost'ах). Раньше
# зона prosto_conn жила в prosto-hardening.conf; переехала сюда, чтобы все
# ключи лимитов были в одном месте — объявить её дважды nginx не даст.
limit_conn_zone $prosto_person_key zone=prosto_conn:10m;
limit_conn_zone $prosto_node_key zone=prosto_node_conn:1m;

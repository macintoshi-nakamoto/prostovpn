server {
    listen 80;
    listen [::]:80;
    server_name prostovpn.cc www.prostovpn.cc;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://prostovpn.cc$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/ssl/prosto/panel.crt;
    ssl_certificate_key /etc/ssl/prosto/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Запрос без нашего имени (по IP или с чужим Host) раньше уходил в панель
    # мимо всех лимитов частоты — это был обход защиты входа. Теперь молча
    # закрываем соединение: настоящие клиенты ходят только по домену.
    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    limit_conn prosto_conn 20;
    limit_conn prosto_node_conn 300;
    server_name prostovpn.cc www.prostovpn.cc;

    ssl_certificate     /etc/letsencrypt/live/prostovpn.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prostovpn.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    location /api/v1/billing/webhook/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /api/v1/login {
        limit_req zone=prosto_login burst=5 nodelay;
        limit_req zone=prosto_node_login burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/admin/login {
        limit_req zone=prosto_login burst=3 nodelay;
        limit_req zone=prosto_node_login burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/password/forgot {
        limit_req zone=prosto_login burst=3 nodelay;
        limit_req zone=prosto_node_login burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/password/reset {
        limit_req zone=prosto_login burst=3 nodelay;
        limit_req zone=prosto_node_login burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Смена пароля: каждая проверка — argon2 на 64 МиБ, под общим /api/
    # (burst 40) пачка таких запросов душила панель. Тот же строгий пояс,
    # что у входа: смена плюс обязательный повторный вход укладываются в burst.
    location = /api/v1/account/password {
        limit_req zone=prosto_login burst=3 nodelay;
        limit_req zone=prosto_node_login burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/register {
        limit_req zone=prosto_login burst=5 nodelay;
        limit_req zone=prosto_node_login burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Узел сам: снимки агента и проверка паролей Hysteria2. Без лимита частоты:
    # оба маршрута защищены адресом узла (агент — ещё и токеном), отказ панели
    # чужому — один дешёвый поиск по базе. В узловую зону их тоже не сажаем:
    # человек из-под VPN выел бы её и снова получил 429 для самого узла.
    # Шторм с узла ограничен на самом узле (бюджет в prosto-hy2-auth.sh).
    location = /api/v1/node/report {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /api/v1/hy2/auth {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location /api/ {
        limit_req zone=prosto_api burst=40 nodelay;
        limit_req zone=prosto_node_api burst=300 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /success.html {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location /downloads/ {
        alias /var/www/downloads/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
    }

    # Установщик Android. Без явного типа nginx отдаёт octet-stream, и Chrome
    # на телефоне сохраняет файл как .bin — Android в таком не видит пакет и
    # ставить отказывается. Имя в Content-Disposition — чтобы файл дошёл под
    # своим именем даже там, где тип по дороге перепишут.
    location ~* ^/downloads/(?<installer>[A-Za-z0-9._-]+\.apk)$ {
        alias /var/www/downloads/$installer;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="$installer"';
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* ^/assets/.*\.(js|css|png|jpe?g|webp|svg|ico|woff2?)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-cache" always;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sub.prostovpn.cc;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://sub.prostovpn.cc$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    limit_conn prosto_conn 20;
    limit_conn prosto_node_conn 300;
    server_name sub.prostovpn.cc;

    ssl_certificate     /etc/letsencrypt/live/prostovpn.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prostovpn.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location /s/ {
        access_log off;
        limit_req zone=prosto_api burst=20 nodelay;
        limit_req zone=prosto_node_api burst=300 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /api/v1/subscription/rotate {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { return 404; }
}

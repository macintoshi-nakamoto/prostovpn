# Rus VPN — второй продукт на том же бэкенде: только кабинет, без лендинга.
# Статика — отдельная сборка web/dist-rusvpn (vite build --mode rusvpn),
# API — та же панель на 127.0.0.1:8000, что и у prostovpn.cc.
# Сертификат — wildcard *.prostovpn.cc (выпуск prostovpn-nodes, DNS-01).

server {
    listen 80;
    listen [::]:80;
    server_name rusvpn.prostovpn.cc;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://rusvpn.prostovpn.cc$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    limit_conn prosto_conn 20;
    server_name rusvpn.prostovpn.cc;

    ssl_certificate     /etc/letsencrypt/live/prostovpn-nodes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prostovpn-nodes/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include snippets/rusvpn-headers.conf;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    root /opt/prosto-vpn/web/dist-rusvpn;

    # Вход, регистрация и восстановление — строгий пояс, как на основном домене.
    location = /api/v1/login {
        limit_req zone=prosto_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/register {
        limit_req zone=prosto_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/password/forgot {
        limit_req zone=prosto_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/password/reset {
        limit_req zone=prosto_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Админка здесь не нужна — у второго продукта своя точка входа не
    # предусмотрена, а чужой хост к ней лучше не подпускать.
    location /admin { return 404; }
    location /api/admin/ { return 404; }

    location /api/ {
        limit_req zone=prosto_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Страница успеха оплаты показывает логин и пароль — не кэшировать.
    location = /success.html {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        include snippets/rusvpn-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Установщики приложения — общие.
    location /downloads/ {
        alias /var/www/downloads/;
        autoindex off;
        include snippets/rusvpn-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    # Установщик Android. Без явного типа nginx отдаёт octet-stream, и Chrome
    # на телефоне сохраняет файл как .bin — Android в таком не видит пакет и
    # ставить отказывается. Имя в Content-Disposition — чтобы файл дошёл под
    # своим именем даже там, где тип по дороге перепишут.
    location ~* ^/downloads/(?<installer>[A-Za-z0-9._-]+\.apk)$ {
        alias /var/www/downloads/$installer;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="$installer"';
        add_header Cache-Control "public, max-age=86400";
    }

    # Ассеты сборки хешированы в имени, картинки из public меняются редко.
    location /assets/ {
        include snippets/rusvpn-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    # Одностраничный кабинет: любой путь — index.html, страницу не кэшируем.
    location / {
        try_files $uri $uri/ /index.html;
        include snippets/rusvpn-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}

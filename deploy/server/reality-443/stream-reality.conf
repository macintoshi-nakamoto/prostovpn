# SNI-роутинг 443: донорские имена -> xray (Reality), всё остальное -> nginx.
# Пустой SNI (старые сборки по IP) попадает в default -> local_https, где его
# ловит default_server. Так 443 держит nginx: сайты переживают падение xray.
map $ssl_preread_server_name $prosto_upstream {
    www.google.com   reality_xray;
    default          local_https;
}
upstream reality_xray { server 127.0.0.1:8444; }
upstream local_https  { server 127.0.0.1:4443; }

server {
    listen 443 reuseport;
    listen [::]:443 reuseport;
    ssl_preread on;
    # PROXY-protocol и в xray, и в nginx: без него оба увидят адрес не клиента,
    # а петли — рухнут и лимит частоты панели, и учёт по IP.
    proxy_protocol on;
    # VLESS-соединения долгие; дефолтные 10 минут простоя рвали бы туннель.
    proxy_timeout 1h;
    proxy_pass $prosto_upstream;
}

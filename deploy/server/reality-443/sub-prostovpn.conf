server {
    listen 80;
    listen [::]:80;
    server_name sub.prostovpn.cc;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://sub.prostovpn.cc$request_uri; }
}

server {
    listen 127.0.0.1:4443 ssl http2 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name sub.prostovpn.cc;

    ssl_certificate     /etc/letsencrypt/live/prostovpn.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prostovpn.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location /s/ {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / { return 404; }
}

# Заголовки безопасности rusvpn.prostovpn.cc. Вынесены в сниппет, потому что
# add_header внутри location отменяет заголовки уровня server — каждому
# location со своим Cache-Control приходится подключать набор заново.
# X-Frame-Options не ставим: кабинет открывается мини-приложением Telegram
# во фрейме, кому можно — перечислено в CSP.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;

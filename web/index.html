<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prosto VPN</title>
    <meta
      name="description"
      content="Prosto VPN: подключение в одно нажатие, 60+ стран, скорость до 1 Гбит/с. Без логов и без сложных настроек. Пробный период — два дня бесплатно."
    />
    <meta name="theme-color" content="#FA4C16" />
    <!-- Иконка сайта — та же оранжевая плитка, что у десктопного клиента. -->
    <link rel="icon" href="/assets/favicon.ico?v=2" sizes="any" />
    <link rel="icon" href="/assets/icon-512.png?v=2" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      Мини-приложение Telegram. Скрипт даёт window.Telegram.WebApp (expand,
      тема, viewport); вне Telegram он безвреден и ничего не делает.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!--
      Тема и язык до первого кадра.

      Скрипт синхронный и стоит в <head> намеренно: React грузится отдельным
      файлом, и пока он идёт по сети, страница уже нарисована. Поставь атрибут
      в компоненте — человеку с тёмной темой сначала мигнёт белый лист. Здесь
      же считается ровно то, что потом посчитает readTheme()/readLang(): для
      темы — «сохранённая, иначе светлая» (системную не читаем — сайт по
      умолчанию светлый), для языка — «сохранённый → язык браузера → русский».
      Разойдись эти правила — первый кадр спорил бы со вторым.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var stored = null;
        var lang = null;
        try {
          stored = localStorage.getItem("prosto_theme");
          lang = localStorage.getItem("prosto_lang");
        } catch (e) {
          // Приватный режим запрещает хранилище — остаются значения по умолчанию.
        }
        // Внутри Telegram признак приходит в хеше адреса раньше любого
        // скрипта: класс tma прячет сайтовую обвязку с первого кадра, а
        // тема, пока свою не выбрали, берётся из темы Telegram (по фону).
        var tma = false;
        try {
          tma =
            location.hash.indexOf("tgWebAppData=") !== -1 ||
            sessionStorage.getItem("prosto_tma") === "1";
        } catch (e) {}
        if (tma) {
          root.classList.add("tma");
          try {
            sessionStorage.setItem("prosto_tma", "1");
          } catch (e) {}
          // Развернуться сразу, не дожидаясь React: иначе до конца загрузки
          // мини-апп живёт полуокном и закрывается свайпом по списку.
          try {
            var wa = window.Telegram && window.Telegram.WebApp;
            if (wa) {
              wa.ready();
              wa.expand();
              if (wa.disableVerticalSwipes) wa.disableVerticalSwipes();
            }
          } catch (e) {}
          // Безопасные зоны и запрет зума — только приложению, сайт не трогаем.
          var vp = document.querySelector('meta[name="viewport"]');
          if (vp)
            vp.setAttribute(
              "content",
              vp.getAttribute("content") +
                ", viewport-fit=cover, maximum-scale=1, user-scalable=no"
            );
          if (stored !== "light" && stored !== "dark") {
            var m = location.hash.match(/tgWebAppThemeParams=([^&]+)/);
            if (m) {
              try {
                var bg = (JSON.parse(decodeURIComponent(m[1])).bg_color || "").replace("#", "");
                if (bg.length === 6) {
                  var lum =
                    parseInt(bg.slice(0, 2), 16) * 0.299 +
                    parseInt(bg.slice(2, 4), 16) * 0.587 +
                    parseInt(bg.slice(4, 6), 16) * 0.114;
                  stored = lum < 128 ? "dark" : "light";
                }
              } catch (e) {}
            }
          }
        }
        var dark = stored === "dark";
        root.setAttribute("data-theme", dark ? "dark" : "light");
        if (dark) {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#12141a");
        }
        if (lang !== "ru" && lang !== "en") {
          var nav = navigator.languages || [navigator.language || "ru"];
          lang = "ru";
          for (var i = 0; i < nav.length; i++) {
            var code = String(nav[i] || "").slice(0, 2).toLowerCase();
            if (code === "ru" || code === "en") {
              lang = code;
              break;
            }
          }
        }
        root.lang = lang;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

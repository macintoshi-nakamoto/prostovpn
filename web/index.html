<!doctype html>
<html lang="ru" class="brand-%VITE_BRAND%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%VITE_BRAND_TITLE%</title>
    <meta
      name="description"
      content="%VITE_BRAND_DESC%"
    />
    <meta name="theme-color" content="%VITE_THEME_COLOR%" />
    <!-- Иконка сайта — та же оранжевая плитка, что у десктопного клиента. -->
    <link rel="icon" href="%VITE_ICON_DIR%/favicon.ico?v=2" sizes="any" />
    <link rel="icon" href="%VITE_ICON_DIR%/icon-512.png?v=2" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="%VITE_ICON_DIR%/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      Мини-приложение Telegram. Скрипт даёт window.Telegram.WebApp (expand,
      тема, viewport); вне Telegram он безвреден и ничего не делает.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!--
      Тема и язык до первого кадра.

      Скрипт синхронный и стоит в <head> намеренно: React грузится отдельным
      файлом, и пока он идёт по сети, страница уже нарисована. Поставь атрибут
      в компоненте — человеку с тёмной темой сначала мигнёт белый лист. Здесь
      же считается ровно то, что потом посчитает lib/theme.jsx и readLang():
      для темы — «сохранённая для этой половины сайта, иначе тёмная в кабинете
      и светлая на витрине», для языка — «сохранённый → язык браузера →
      русский». Разойдись эти правила — первый кадр спорил бы со вторым.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var lang = null;
        try {
          lang = localStorage.getItem("prosto_lang");
        } catch (e) {
          // Приватный режим запрещает хранилище — остаются значения по умолчанию.
        }
        // Внутри Telegram признак приходит в хеше адреса раньше любого
        // скрипта: класс tma прячет сайтовую обвязку с первого кадра.
        // Но одного хеша мало — его подсунет любая чужая ссылка. Режим
        // мини-аппа включаем только в контейнере Telegram: те же три
        // канала, по которым telegram-web-app.js шлёт события клиенту
        // (см. lib/telegram.js). Нативные клиенты внедряют
        // TelegramWebviewProxy до любого скрипта страницы, iframe виден
        // сразу. В dev-сборке хеш разрешён — так мини-апп эмулируется локально.
        var container = "%DEV%" === "true";
        try {
          container =
            container ||
            !!window.TelegramWebviewProxy ||
            !!(window.external && "notify" in window.external) ||
            window.parent !== window;
        } catch (e) {
          // доступ к parent бросил — мы точно в чужом фрейме
          container = true;
        }
        var tma = false;
        try {
          tma =
            container &&
            (location.hash.indexOf("tgWebAppData=") !== -1 ||
              sessionStorage.getItem("prosto_tma") === "1");
        } catch (e) {}
        // Формат приложения: в Telegram — всегда, на сайте — в кабинете.
        // Ставится до рендера, чтобы вид не мигал; дальше синхронизирует
        // App.jsx при SPA-переходах.
        var app =
          tma ||
          location.pathname === "/account" ||
          location.pathname.indexOf("/account/") === 0;
        if (app) {
          root.classList.add("app");
        }
        if (tma) {
          root.classList.add("tma");
          try {
            sessionStorage.setItem("prosto_tma", "1");
          } catch (e) {}
          // Развернуться сразу, не дожидаясь React: иначе до конца загрузки
          // мини-апп живёт полуокном и закрывается свайпом по списку.
          try {
            var wa = window.Telegram && window.Telegram.WebApp;
            if (wa) {
              wa.ready();
              wa.expand();
              if (wa.disableVerticalSwipes) wa.disableVerticalSwipes();
            }
          } catch (e) {}
          // Безопасные зоны и запрет зума — только приложению, сайт не трогаем.
          var vp = document.querySelector('meta[name="viewport"]');
          if (vp)
            vp.setAttribute(
              "content",
              vp.getAttribute("content") +
                ", viewport-fit=cover, maximum-scale=1, user-scalable=no"
            );
        }
        // Тема. В кабинете и в Telegram — тёмная, на витрине — светлая.
        // Значения по умолчанию разные, поэтому и выбранное руками хранится
        // отдельно для каждой половины: с одним общим ключом нажатие
        // переключателя в любом месте красило обе половины одинаково.
        // Тему Telegram намеренно не читаем: мини-приложение тёмное всегда,
        // пока человек сам не решит иначе.
        //
        // У бренда без витрины (Rus VPN) светлой половины нет вовсе: корень
        // и так ведёт в кабинет, и без этой оговорки на нём мигал бы белый
        // лист ровно до редиректа.
        var night = app || "%VITE_NO_LANDING%" === "1";
        var pick = null;
        try {
          pick = localStorage.getItem(night ? "prosto_theme_app" : "prosto_theme_site");
          // Общий ключ прежних времён. Переносить его некуда: по нему не
          // понять, о какой половине шла речь, когда его записывали.
          localStorage.removeItem("prosto_theme");
        } catch (e) {}
        var dark = pick === "dark" || (pick !== "light" && night);
        root.setAttribute("data-theme", dark ? "dark" : "light");
        if (dark) {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "%VITE_THEME_DARK%");
        }
        if (lang !== "ru" && lang !== "en") {
          var nav = navigator.languages || [navigator.language || "ru"];
          lang = "ru";
          for (var i = 0; i < nav.length; i++) {
            var code = String(nav[i] || "").slice(0, 2).toLowerCase();
            if (code === "ru" || code === "en") {
              lang = code;
              break;
            }
          }
        }
        root.lang = lang;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
